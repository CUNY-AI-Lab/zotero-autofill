name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-result
          path: .scaffold/build

  test:
    # Integration tests run against the current stable Zotero and the beta
    # (newer Gecko), since the plugin supports both.
    name: test (Zotero ${{ matrix.channel }})
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        channel:
          - release
          - beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Download Zotero (${{ matrix.channel }})
        run: |
          mkdir -p "$RUNNER_TEMP/zotero"
          cd "$RUNNER_TEMP/zotero"
          curl -fsSL -o zotero.archive "https://www.zotero.org/download/client/dl?platform=linux-x86_64&channel=${{ matrix.channel }}"
          # Builds are .tar.xz now and were .tar.bz2; refuse anything else (e.g. an HTML error page).
          case "$(file -b zotero.archive)" in
            XZ*|bzip2*) ;;
            *) echo "::error::Zotero download is not an xz/bzip2 archive: $(file -b zotero.archive)"; head -c 300 zotero.archive; exit 1 ;;
          esac
          tar -xf zotero.archive
          test -x Zotero_linux-x86_64/zotero
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$PWD/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"
      - run: npm run test
